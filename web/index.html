<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Ruta base para Flutter Web -->
  <base href="/">

  <!-- Configuracion general -->
  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="PokéExplorer - Aplicacion interactiva de Pokemon"
  >

  <!-- Configuracion movil -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="PokéExplorer"
  >

  <!-- Iconos -->
  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- Nombre de la aplicacion -->
  <title>PokéExplorer</title>

  <!-- Configuracion de la aplicacion Web -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- Google Maps JavaScript API -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC8hqPgts_Eq0T1rOm78EDlf9bWK5aJQoU&libraries=maps">
  </script>

</head>

<body>
  <!-- Inicializacion de Flutter Web -->
  <script
    src="flutter_bootstrap.js"
    async>
  </script>
</body>

</html>
